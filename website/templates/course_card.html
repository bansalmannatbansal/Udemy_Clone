{% load static %}
<a href="{% url 'course_detail' course.slug %}" class="course-card">
    <img src="{% static 'images/'|add:course.image %}" alt="{{ course.title }}">
    <div class="course-card-body">
        <h3>{{ course.title }}</h3>
        <p class="instructor">{{ course.instructor }}</p>
        <p class="rating"><strong>{{ course.rating }}</strong> ★★★★☆ <span>({{ course.reviews }})</span></p>
        <p class="price"><strong>₹{{ course.price }}</strong> <s>₹{{ course.original_price }}</s></p>
    </div>
</a>
